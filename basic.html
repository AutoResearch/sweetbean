<script>
window.__sb_fit__=function(enabled){
  if(enabled===undefined){enabled=true;}
  var apply=function(){
    var root=document.getElementById('jspsych-content');
    if(!root)return;
    if(!enabled){
      root.style.zoom='';
      document.documentElement.style.overflow='auto';
      document.body.style.overflow='auto';
      return;
    }
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
    root.style.zoom='';
    var rect=root.getBoundingClientRect();
    if(rect.width===0||rect.height===0)return;
    var sx=(window.innerWidth*0.95)/rect.width;
    var sy=(window.innerHeight*0.92)/rect.height;
    var s=Math.min(sx,sy);
    s=Math.max(0.4,Math.min(2.5,s));
    if(Math.abs(s-1)>0.01){root.style.zoom=s.toFixed(3);}
  };
  requestAnimationFrame(apply);
};
var __sb_resize_t__=null;
window.addEventListener('resize',function(){
  clearTimeout(__sb_resize_t__);
  __sb_resize_t__=setTimeout(function(){
    var root=document.getElementById('jspsych-content');
    if(root&&root.style.zoom!==''){window.__sb_fit__(true);}
  },120);
});
</script>
